[project]
name = "arcofmarket"
version = "0.0.1"
description = "ArcOfMarket compact public market data and transparent research signals"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Albert Zhang" }]
requires-python = ">=3.13"
dependencies = [
  "yfinance>=0.2.60,<1.5",
  "pandas",
  "requests",
  "lxml",
  "jsonschema>=4.25,<5",
]

[project.urls]
Repository = "https://github.com/AlbertAZ1992/arc-of-market"

[dependency-groups]
dev = [
  "pytest",
  "ruff",
  "ty",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "scripts"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "SIM",
  "C901",
  "PLR0911",
  "PLR0912",
  "PLR0913",
  "PLR0915",
]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.format]
quote-style = "double"

[tool.ty.environment]
python-version = "3.13"
root = ["src", "."]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
