name: daily-update

on:
  schedule:
    # 07:07 Asia/Shanghai, Tuesday through Saturday.
    - cron: "7 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    uses: ./.github/workflows/update-data.yml
    secrets: inherit
