name: daily-update

on:
  schedule:
    # Start one hour after close; later runs recover delayed or failed publication.
    - cron: "17 17-21 * * 1-5"
      timezone: "America/New_York"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-market-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure release commit
        run: |
          set -euo pipefail
          git config user.name "arc-of-market-bot"
          git config user.email "bot@arcofmarket.com"

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          version: "0.10.11"

      - name: Install Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Generate today's market release
        id: release
        run: |
          set -euo pipefail
          uv run python scripts/market_data.py --github-output "$GITHUB_OUTPUT"

      - name: Commit and push release to main
        run: |
          set -euo pipefail
          git add releases/market
          if ! git diff --cached --quiet; then
            git commit -m "Publish market release $(date -u +%F)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Publish release to Cloud
        env:
          ARC_CLOUD_ENDPOINT: ${{ vars.ARC_CLOUD_ENDPOINT }}
          ARC_INGEST_KEY_ID: github-production
          ARC_INGEST_SECRET: ${{ secrets.ARC_INGEST_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$ARC_CLOUD_ENDPOINT" ]; then
            echo "ARC_CLOUD_ENDPOINT is not configured" >&2
            exit 1
          fi
          if [ -z "$ARC_INGEST_SECRET" ]; then
            echo "ARC_INGEST_SECRET is not configured" >&2
            exit 1
          fi
          uv run python scripts/publish_strategy_decision.py \
            --endpoint "$ARC_CLOUD_ENDPOINT" \
            --release releases/market/latest.json
