name: weekly-update

on:
  schedule:
    - cron: "27 8 * * 6"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    uses: ./.github/workflows/update-data.yml
    with:
      profile: weekly
    secrets: inherit
